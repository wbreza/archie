schema_version: "1"
id: schemas
name: Authoritative JSON schemas
summary: Defines authored metadata and read-response shapes as bundled, offline JSON Schema resources.
kind: contract
tags: [schemas, json, validation, offline]
description: |
  The authored-record schema is the single shape definition for descriptive
  metadata. The root schema extends it for root-only discovery exclusions;
  the response schema separately describes the public JSON envelope and record
  views. Unknown fields and authored parent/child relations are rejected rather
  than becoming a parallel metadata dialect.

  Go embedding ships these schemas with the binary. Compilation registers only
  the bundled resources and refuses external resolution: schema identifiers are
  not runtime download endpoints. The repository parser validates against the
  root or record schema after strict YAML checks; transport and runtime tests
  also use the response schema. Filesystem containment and graph meaning remain
  runtime responsibilities beyond schema validation.
links:
